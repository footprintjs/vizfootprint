name: AgentFootprint peer report

on:
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - scripts/agent-peer-report/**
      - .github/workflows/agent-peer-report.yml

permissions:
  contents: read

jobs:
  install:
    name: Real consumer install report
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      npm_config_fetch_retries: 0
      SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --global npm@11.19.0
      - name: Install the pinned second resolver in runner scratch space
        run: npm install --prefix "$RUNNER_TEMP/viz-peer-tools" --no-save --ignore-scripts --no-audit --no-fund pnpm@10.11.0
      - name: Generate peer metadata with npm while preserving the locked graph
        run: |
          npm install --package-lock-only --ignore-scripts --strict-peer-deps --no-audit --no-fund
          git diff --exit-code -- package.json ui/package.json studio/package.json bridges/vega-lite/package.json
          mkdir "$RUNNER_TEMP/viz-agent-peer"
          cp package-lock.json "$RUNNER_TEMP/viz-agent-peer/package-lock.json"
      - name: Measure each real installer once without lifecycle hooks
        env:
          PNPM_BINARY: ${{ runner.temp }}/viz-peer-tools/node_modules/.bin/pnpm
        run: node scripts/agent-peer-report/install.mjs
      - name: Preserve only source-bound results and raw installer output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viz-agent-peer-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/viz-agent-peer/*.json
            ${{ runner.temp }}/viz-agent-peer/*.log
          if-no-files-found: error
          retention-days: 7
