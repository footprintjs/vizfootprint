name: Viz checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: viz-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Preparation is a report, not a freshness gate: only the committed lock owns
  # required installation. A later npm publish cannot invalidate an unchanged head.
  lock-refresh:
    name: Lock preparation report
    if: github.event_name == 'pull_request'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: changed
        env:
          SOURCE_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --quiet "$SOURCE_BASE" HEAD -- package.json package-lock.json ui/package.json studio/package.json bridges/vega-lite/package.json; then
            echo 'value=false' >> "$GITHUB_OUTPUT"
          else
            echo 'value=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        if: steps.changed.outputs.value == 'true'
        with:
          node-version: 22
          package-manager-cache: false
      - if: steps.changed.outputs.value == 'true'
        run: npm install --global npm@11.19.0
      - if: steps.changed.outputs.value == 'true'
        name: Generate real lock bytes without builds or lifecycle hooks
        run: |
          # A new major graph must not inherit the old hoisted optional-peer choice.
          # The immutable prior lock remains in Git; npm creates every new entry.
          rm package-lock.json
          npm install --package-lock-only --ignore-scripts --strict-peer-deps --no-audit --no-fund
          git diff --exit-code -- package.json ui/package.json studio/package.json bridges/vega-lite/package.json
          mkdir "$RUNNER_TEMP/viz-lock"
          cp package-lock.json "$RUNNER_TEMP/viz-lock/package-lock.json"
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
          const hashes = Object.fromEntries(['package.json', 'ui/package.json', 'studio/package.json', 'bridges/vega-lite/package.json', 'package-lock.json'].map(path => [path, createHash('sha256').update(readFileSync(path)).digest('hex')]));
          writeFileSync(join(process.env.RUNNER_TEMP, 'viz-lock/source.json'), JSON.stringify({ head: git('rev-parse', 'HEAD'), tree: git('rev-parse', 'HEAD^{tree}'), run: process.env.GITHUB_RUN_ID, attempt: process.env.GITHUB_RUN_ATTEMPT, hashes }, null, 2) + '\n');
          NODE
      - if: steps.changed.outputs.value == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: viz-lock-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/viz-lock/
          if-no-files-found: error
          retention-days: 7

  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    defaults:
      run:
        working-directory: vizfootprint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: vizfootprint
          persist-credentials: false
      # Immutable test-tool source, not a mutable sibling run or source package.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: footprintjs/ci
          ref: 1ca5d7de9bde68c205b5d140c94dc475ae3b2520
          path: .ci-tools
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      # Match the family's strict resolver; npm10 can fail on Vitest4's
      # optional peer graph before any test runs.
      - run: npm install --global npm@11.19.0
      - name: Keep historical refusal boundaries and current published identity controls
        env:
          NATIVE_ARCHIVE_PORT: ${{ github.workspace }}/.ci-tools/src/release-route/archive
        run: |
          node --test scripts/native-cohort/*.node-test.mjs
          python3 -B -m unittest discover -s scripts/native-cohort -p '*_test.py'
      - name: Install the committed published graph normally
        run: npm ci --strict-peer-deps
      - name: Install the matching real-browser test runtime
        run: npx --no-install playwright-core install --with-deps chromium-headless-shell
      - name: Verify the installed record and engine graph
        id: published_inputs
        run: |
          npm ls agentfootprint footprintjs foottrace --all
          node scripts/native-cohort.mjs checkpoint
      - name: Keep every workspace private
        run: |
          node --input-type=module -e "import {readFileSync} from 'node:fs'; for (const file of ['package.json', 'ui/package.json', 'studio/package.json', 'bridges/vega-lite/package.json']) { if (JSON.parse(readFileSync(file, 'utf8')).private !== true) throw new Error(file + ' must stay private'); }"
      - run: npm run typecheck
      - run: npm run build
      - run: npm run build:ui
      - run: npm run typecheck:ui
      - run: npm run typecheck:vega-lite
      - run: npm run typecheck:demo
      - run: npm run typecheck:demo-agent
      - run: npm run check:profile-package
      - name: Run all tests with the existing 100% coverage thresholds
        run: npm run test:coverage
      # Studio is the app layer: it resolves the BUILT UI package, is the one
      # workspace importing Storydeck, and keeps its independent 100% gate.
      - name: Run the studio tests with their own 100% coverage thresholds
        run: npm run test:studio
      - name: Keep source bytes, installed images, compiler and locks after every source gate
        env:
          EXPECTED_PUBLISHED_CHECKPOINT: ${{ steps.published_inputs.outputs.checkpoint_sha256 }}
        run: |
          node scripts/native-cohort.mjs verify-published > "$RUNNER_TEMP/viz-published-cohort/verify-result.json"
          cat "$RUNNER_TEMP/viz-published-cohort/verify-result.json"
      - name: Pack the actual reviewed source for app snapshot consumption
        run: |
          mkdir "$RUNNER_TEMP/viz-pack"
          npm pack --ignore-scripts --json --workspaces=false --pack-destination "$RUNNER_TEMP/viz-pack" > "$RUNNER_TEMP/viz-pack/npm-pack.json"
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
          const dir = join(process.env.RUNNER_TEMP, 'viz-pack');
          const [pack] = JSON.parse(readFileSync(join(dir, 'npm-pack.json')));
          if (!pack || pack.filename !== `vizfootprint-${pack.version}.tgz`) throw Error('Unexpected pack basename');
          const raw = readFileSync(join(dir, pack.filename));
          writeFileSync(join(dir, 'source.json'), JSON.stringify({ head: git('rev-parse', 'HEAD'), tree: git('rev-parse', 'HEAD^{tree}'), run: process.env.GITHUB_RUN_ID, attempt: process.env.GITHUB_RUN_ATTEMPT, node: process.version, filename: pack.filename, bytes: raw.length, sha256: createHash('sha256').update(raw).digest('hex') }, null, 2) + '\n');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: viz-pack-${{ matrix.node }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/viz-pack/
            ${{ runner.temp }}/viz-published-cohort/checkpoint.json
            ${{ runner.temp }}/viz-published-cohort/verify-result.json
          if-no-files-found: error
          retention-days: 7
